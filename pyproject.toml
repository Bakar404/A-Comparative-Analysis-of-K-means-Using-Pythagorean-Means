[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pythagorean-kmeans"
version = "0.1.0"
description = "Reproduction of K-means with Pythagorean centroid means"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Abdelsalam"}]
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
